<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polinomi passo passo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#26334d;background:#f6f7fc;font-size:18px}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}header{background:#fff;border-bottom:1px solid #e4e8f1} .top{max-width:1050px;margin:auto;padding:18px 24px;display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;background:#5747c8;color:white;border-radius:15px;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:1.15rem}.brand span{font-size:.8rem;color:#65718a}main{max-width:1050px;margin:auto;padding:30px 24px 70px}.intro{background:#edeafd;border-radius:24px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5747c8}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:10px 0}h2{font-size:1.6rem;margin:0 0 12px}h3{margin:0 0 8px;font-size:1.18rem}p{line-height:1.55;margin:8px 0 16px}.intro p{max-width:600px;margin-bottom:0}.art{font-weight:800;color:#6555cb;font-size:2rem;background:#fff;border-radius:22px;padding:25px;white-space:nowrap;box-shadow:0 8px 25px #4b3ca51a}.progress{margin:27px 0 12px;display:flex;justify-content:space-between;gap:10px;font-weight:700}.bar{height:10px;background:#e3e5ef;border-radius:10px;overflow:hidden}.fill{height:100%;background:#56a788;transition:width .2s}.layout{display:grid;grid-template-columns:240px 1fr;gap:22px;margin-top:26px}.menu,.card{background:white;border:1px solid #e4e8f1;border-radius:20px}.menu{padding:12px;height:max-content}.menu button{width:100%;border:0;background:transparent;border-radius:12px;text-align:left;padding:12px;color:#42506a;display:flex;align-items:center;gap:10px}.menu button.active{background:#eeebff;color:#4b3bb5;font-weight:800}.number{width:30px;height:30px;border-radius:50%;background:#f0f2f8;display:grid;place-items:center;font-size:.8rem;flex:none}.active .number{background:#5b4aca;color:white}.card{padding:30px;min-height:450px}.tag{display:inline-block;background:#e5f5ee;color:#287256;border-radius:100px;padding:6px 12px;font-weight:700;font-size:.8rem;margin-bottom:16px}.example{background:#f5f3ff;border-left:5px solid #7463dd;border-radius:12px;padding:18px 20px;margin:20px 0;font-size:1.15rem}.math{font-size:1.4rem;font-weight:800;letter-spacing:.02em}.tip{background:#fff8e8;border-radius:12px;padding:15px 18px;margin:18px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.primary,.secondary,.choice{border-radius:12px;padding:12px 18px;font-weight:750}.primary{border:2px solid #5949c7;background:#5949c7;color:white}.secondary{border:2px solid #dcdff0;background:white;color:#4b3bb5}.choice{border:2px solid #dcdff0;background:white;color:#26334d;text-align:left}.choice:hover,.secondary:hover{background:#f3f1ff;border-color:#8b7ae0}.choices{display:grid;gap:10px;margin-top:20px}.feedback{padding:15px 18px;border-radius:12px;margin-top:18px;line-height:1.5}.good{background:#e4f6ec;color:#216745}.retry{background:#fff3df;color:#805319}.muted{color:#647089;font-size:.9rem}.counter{color:#6556bd;font-weight:800;font-size:.85rem;margin-bottom:12px}.footer{text-align:center;color:#66728a;font-size:.8rem;margin-top:30px} @media(max-width:700px){main{padding:20px 16px 50px}.intro{padding:22px}.art{display:none}.layout{grid-template-columns:1fr}.menu{display:flex;overflow:auto;gap:5px}.menu button{width:auto;white-space:nowrap}.card{padding:22px;min-height:0}.top{padding:14px 16px}}
</style></head><body><header><div class="top"><div class="logo" aria-hidden="true">x²</div><div class="brand"><strong>Polinomi passo passo</strong><span>Impariamo insieme, con calma</span></div></div></header><main><section class="intro"><div><div class="eyebrow">La tua piccola palestra di matematica</div><h1>Un passo alla volta.</h1><p>Scopri i polinomi con esempi semplici e piccoli esercizi. Puoi riprovare tutte le volte che vuoi.</p></div><div class="art" aria-hidden="true">2x + 3</div></section><div class="progress"><span>Il tuo percorso</span><span id="progressText"></span></div><div class="bar" role="progressbar" aria-label="Lezioni completate" aria-valuemin="0" aria-valuemax="8" id="progressBar"><div class="fill" id="fill"></div></div><div class="layout"><nav class="menu" id="menu" aria-label="Lezioni"></nav><section class="card" id="content" aria-live="polite"></section></div><div class="footer">I progressi restano su questo browser e su questo dispositivo.</div></main><script>
const lessons=[
{title:'I monomi', intro:'Partiamo dai pezzi', text:'Un monomio è un numero, una lettera o un prodotto di numeri e lettere.', example:'3x', explain:'3 è il coefficiente, cioè il numero. x è la parte letterale, cioè la lettera.', tip:'Se vedi x da sola, il suo coefficiente è 1: x = 1x.', questions:[{q:'Nel monomio 5x, qual è il coefficiente?',choices:['5','x','5x'],answer:0,help:'Il coefficiente è il numero davanti alla lettera.',why:'Esatto: 5 è il numero davanti alla x.'},{q:'Qual è la parte letterale di 2a?',choices:['2','a','2a'],answer:1,help:'La parte letterale è la lettera.',why:'Esatto: la parte letterale è a.'}]},
{title:'I polinomi',intro:'Mettiamo insieme i pezzi',text:'Un polinomio è formato da uno o più monomi, chiamati termini, collegati da + o −.',example:'2x + 3',explain:'Questo polinomio ha due termini: 2x e 3. Il segno + indica una somma.',tip:'Anche un numero da solo, come 3, può essere un termine.',questions:[{q:'Quanti termini ci sono in x + 4?',choices:['1','2','4'],answer:1,help:'Conta i pezzi separati dal segno +.',why:'Esatto: i termini sono x e 4.'},{q:'Quali sono i termini di 3x − 2?',choices:['3 e x','3x e −2','x e 2'],answer:1,help:'Considera anche il segno davanti al numero 2.',why:'Esatto: i termini sono 3x e −2.'}]},
{title:'Termini simili',intro:'Troviamo quelli che si assomigliano',text:'Due termini sono simili se hanno la stessa parte letterale, con gli stessi esponenti.',example:'2x e 5x sono simili',explain:'Hanno entrambi la stessa parte letterale: x. I numeri davanti possono essere diversi.',tip:'x e x² non sono simili: gli esponenti sono diversi. In x l’esponente è 1.',questions:[{q:'Quale termine è simile a 3x?',choices:['4x','3y','4x²'],answer:0,help:'Cerca la stessa lettera, con lo stesso esponente.',why:'Esatto: 3x e 4x hanno entrambi x.'},{q:'x e x² sono termini simili?',choices:['Sì','No'],answer:1,help:'Confronta gli esponenti: x significa x¹.',why:'Esatto: gli esponenti 1 e 2 sono diversi.'}]},
{title:'Somma e sottrazione',intro:'Uniamo i termini simili',text:'Per sommare o sottrarre termini simili, fai il calcolo con i coefficienti e conserva la parte letterale.',example:'2x + 3x = 5x',explain:'Somma i coefficienti: 2 + 3 = 5. La lettera x resta uguale.',tip:'I termini non simili restano separati: 2x + 3 non diventa 5x.',questions:[{q:'Quanto fa 4x + 2x?',choices:['6x','6x²','8x'],answer:0,help:'Somma 4 + 2 e conserva x.',why:'Esatto: 4 + 2 = 6, quindi 6x.'},{q:'Quanto fa 5x − 2x?',choices:['3','3x','7x'],answer:1,help:'Sottrai i coefficienti: 5 − 2.',why:'Esatto: 5 − 2 = 3, quindi 3x.'},{q:'Come si scrive 2x + 3?',choices:['5x','5','2x + 3'],answer:2,help:'2x e 3 non sono termini simili.',why:'Esatto: i termini restano separati.'}]},
{title:'Moltiplicazione',intro:'Un passo in più',text:'Per moltiplicare un monomio per un polinomio, moltiplica il monomio per ogni termine dentro la parentesi.',example:'2 · (x + 3) = 2x + 6',explain:'Prima 2 · x = 2x. Poi 2 · 3 = 6. Unisci i risultati con +.',tip:'Ricorda di moltiplicare tutti i termini dentro la parentesi.',questions:[{q:'Quanto fa 3 · (x + 2)?',choices:['3x + 2','3x + 6','x + 6'],answer:1,help:'Calcola 3 · x e poi 3 · 2.',why:'Esatto: 3 · x = 3x e 3 · 2 = 6.'},{q:'Quanto fa 2 · (x − 4)?',choices:['2x − 8','2x − 4','2x + 8'],answer:0,help:'Moltiplica sia x sia −4 per 2.',why:'Esatto: 2 · x = 2x e 2 · (−4) = −8.'}]}
];

lessons[0].questions.push({q:'Nel monomio −4y, qual è il coefficiente?',choices:['4','−4','y'],answer:1,help:'Il segno meno fa parte del numero.',why:'Esatto: il coefficiente è −4.'},{q:'Qual è il coefficiente di x?',choices:['0','1','x'],answer:1,help:'x da sola significa 1x.',why:'Esatto: x = 1x.'},{q:'Qual è la parte letterale di 7a²?',choices:['7','a','a²'],answer:2,help:'Prendi la lettera insieme al suo esponente.',why:'Esatto: la parte letterale è a².'});
lessons[1].questions.push({q:'Quanti termini ci sono in 2x + 3y − 5?',choices:['2','3','5'],answer:1,help:'Conta i pezzi separati dai segni + e −.',why:'Esatto: sono 2x, 3y e −5.'},{q:'Quale tra questi è un polinomio?',choices:['x + 2','solo il segno +','una parentesi vuota'],answer:0,help:'Cerca un’espressione fatta di termini.',why:'Esatto: x + 2 ha due termini.'},{q:'Qual è il termine senza lettera in 4x + 7?',choices:['4x','7','x'],answer:1,help:'Cerca il numero scritto da solo.',why:'Esatto: 7 è il termine senza lettera.'});
lessons[2].questions.push({q:'Quale termine è simile a 2a²?',choices:['5a²','5a','2b²'],answer:0,help:'Servono la stessa lettera e lo stesso esponente.',why:'Esatto: entrambi hanno a².'},{q:'7 e −3 sono termini simili?',choices:['Sì','No'],answer:0,help:'Sono entrambi numeri senza parte letterale.',why:'Esatto: sono entrambi termini senza lettera.'},{q:'2x e 2y sono simili?',choices:['Sì','No'],answer:1,help:'Guarda se le lettere sono uguali.',why:'Esatto: x e y sono lettere diverse.'});
lessons[3].questions.push({q:'Quanto fa 3a + a?',choices:['3a','4a','4a²'],answer:1,help:'a significa 1a: somma 3 + 1.',why:'Esatto: 3a + 1a = 4a.'},{q:'Quanto fa 8 − 3?',choices:['5','11','5x'],answer:0,help:'Sottrai i due numeri.',why:'Esatto: 8 − 3 = 5.'},{q:'Semplifica 2x + 3 + x.',choices:['6x','3x + 3','2x + 4x'],answer:1,help:'Somma 2x e x. Il numero 3 resta separato.',why:'Esatto: 2x + x = 3x e il 3 rimane.'});
lessons[4].questions.push({q:'Quanto fa 4 · (x + 1)?',choices:['4x + 1','4x + 4','x + 4'],answer:1,help:'Moltiplica entrambi i termini per 4.',why:'Esatto: 4 · x = 4x e 4 · 1 = 4.'},{q:'Quanto fa 3 · (2x + 1)?',choices:['6x + 3','6x + 1','5x + 3'],answer:0,help:'Calcola 3 · 2x e 3 · 1.',why:'Esatto: ottieni 6x + 3.'},{q:'Quanto fa x · (x + 2)?',choices:['x² + 2x','x² + 2','2x + 2'],answer:0,help:'x · x = x² e x · 2 = 2x.',why:'Esatto: i risultati sono x² e 2x.'});
lessons.push({title:'Divisione tra polinomi',intro:'Dividiamo un pezzo alla volta',text:'Per dividere un polinomio per un monomio, dividi ogni termine. Per esempio, (6x + 9) : 3 = 2x + 3, perché 6x : 3 = 2x e 9 : 3 = 3.',example:'(x² + 3x + 2) : (x + 1) = x + 2',explain:'Quando il divisore ha più termini, procedi così: 1. Dividi x² per x: ottieni x. 2. Moltiplica x · (x + 1) = x² + x e sottrai: resta 2x + 2. 3. Dividi 2x per x: ottieni 2. Moltiplica 2 · (x + 1) = 2x + 2 e sottrai: resta 0. Il risultato è x + 2.',tip:'Per controllare una divisione con resto zero, moltiplica il risultato per il divisore: (x + 2) · (x + 1) = x² + 3x + 2. A volte la divisione ha un resto diverso da zero.',questions:[{q:'Quanto fa (6x + 9) : 3?',choices:['2x + 3','2x + 9','6x + 3'],answer:0,help:'Dividi sia 6x sia 9 per 3.',why:'Esatto: 6x : 3 = 2x e 9 : 3 = 3.'},{q:'Quanto fa (8x − 4) : 4?',choices:['2x − 1','2x − 4','4x − 1'],answer:0,help:'Dividi ogni termine per 4, conservando il segno meno.',why:'Esatto: 8x : 4 = 2x e −4 : 4 = −1.'},{q:'Nella divisione (x² + 3x + 2) : (x + 1), quanto fa x² : x?',choices:['x','x²','2'],answer:0,help:'x² significa x · x. Se dividi per x, resta una x.',why:'Esatto: x² : x = x.'},{q:'Quanto fa x · (x + 1)?',choices:['x² + x','x² + 1','2x'],answer:0,help:'Moltiplica x per ciascun termine nella parentesi.',why:'Esatto: x · x = x² e x · 1 = x.'},{q:'Se da x² + 3x + 2 togli x² + x, che cosa resta?',choices:['2x + 2','3x + 2','2x'],answer:0,help:'x² − x² = 0 e 3x − x = 2x. Il 2 resta.',why:'Esatto: resta 2x + 2.'},{q:'Qual è il risultato di (x² + 3x + 2) : (x + 1)?',choices:['x + 2','x + 1','x² + 2'],answer:0,help:'Rileggi i due pezzi del risultato: prima x, poi 2.',why:'Esatto: il risultato è x + 2 e il resto è 0.'},{q:'Come puoi controllare una divisione con resto zero?',choices:['Moltiplicando risultato e divisore','Sommando risultato e divisore','Guardando solo il primo termine'],answer:0,help:'L’operazione inversa della divisione è la moltiplicazione.',why:'Esatto: il prodotto deve dare il polinomio iniziale.'}]});

// Le lezioni già completate conservano i loro numeri; le nuove seguono il percorso esistente.
lessons[4].title = 'Monomio per polinomio';
lessons.push({title:'Somma e differenza di polinomi',intro:'Togliamo le parentesi con attenzione',text:'Per sommare due o più polinomi, togli le parentesi precedute da + senza cambiare i segni. Poi unisci i termini simili. Per sottrarre un polinomio, cambia il segno di ogni termine nella parentesi preceduta da −.',example:'(3x + 2) − (x + 5) = 3x + 2 − x − 5 = 2x − 3',explain:'Il meno davanti alla seconda parentesi cambia entrambi i segni: +x diventa −x e +5 diventa −5. Poi 3x − x = 2x e 2 − 5 = −3.',tip:'Con più polinomi procedi nello stesso modo: (x + 2) + (2x + 1) + (x − 3) = 4x. Somma i termini con x e poi i numeri.',questions:[
{q:'Quanto fa (2x + 1) + (x + 3)?',choices:['3x + 4','3x + 3','2x + 4'],answer:0,help:'Somma 2x + x e poi 1 + 3.',why:'Esatto: 2x + x = 3x e 1 + 3 = 4.'},
{q:'Come si toglie la parentesi in −(x + 4)?',choices:['−x − 4','−x + 4','x − 4'],answer:0,help:'Il meno davanti cambia il segno di ogni termine.',why:'Esatto: entrambi i segni cambiano.'},
{q:'Quanto fa (5x + 3) − (2x + 1)?',choices:['3x + 2','3x + 4','7x + 2'],answer:0,help:'Scrivi 5x + 3 − 2x − 1, poi unisci i termini simili.',why:'Esatto: 5x − 2x = 3x e 3 − 1 = 2.'},
{q:'Quanto fa (4x − 2) − (x − 3)?',choices:['3x + 1','3x − 5','5x + 1'],answer:0,help:'Il meno cambia −3 in +3: 4x − 2 − x + 3.',why:'Esatto: 4x − x = 3x e −2 + 3 = 1.'},
{q:'Quanto fa (x + 1) + (2x + 2) + (x + 3)?',choices:['4x + 6','3x + 6','4x + 5'],answer:0,help:'Somma separatamente x + 2x + x e 1 + 2 + 3.',why:'Esatto: ottieni 4x + 6.'},
{q:'Quanto fa (3x + 2) − (x + 5)?',choices:['2x − 3','2x + 7','4x − 3'],answer:0,help:'Cambia entrambi i segni nella seconda parentesi.',why:'Esatto: 3x − x = 2x e 2 − 5 = −3.'}
]});
lessons.push({title:'Polinomio per polinomio',intro:'Ogni termine incontra ogni termine',text:'Per moltiplicare due polinomi, moltiplica ogni termine del primo per ogni termine del secondo. Poi somma i risultati e unisci i termini simili.',example:'(x + 2) · (x + 3) = x² + 3x + 2x + 6 = x² + 5x + 6',explain:'Calcola quattro prodotti: x · x = x²; x · 3 = 3x; 2 · x = 2x; 2 · 3 = 6. Infine somma 3x + 2x = 5x.',tip:'Non dimenticare i segni: + per − dà −; − per − dà +. Per esempio, (x − 1) · (x + 2) = x² + 2x − x − 2 = x² + x − 2.',questions:[
{q:'In (x + 2) · (x + 3), quanto fa x · x?',choices:['x²','2x','x'],answer:0,help:'x · x si scrive x².',why:'Esatto: x · x = x².'},
{q:'Nello stesso esempio, quanto fa 2 · 3?',choices:['6','5','6x'],answer:0,help:'Moltiplica i due numeri.',why:'Esatto: 2 · 3 = 6.'},
{q:'Quanto fa (x + 1) · (x + 2)?',choices:['x² + 3x + 2','x² + 2','x² + 2x + 1'],answer:0,help:'Scrivi x² + 2x + x + 2 e unisci i termini simili.',why:'Esatto: 2x + x = 3x.'},
{q:'Quanto fa (x + 1) · (x + 1)?',choices:['x² + 2x + 1','x² + 1','x² + x + 1'],answer:0,help:'I prodotti sono x², x, x e 1.',why:'Esatto: x + x = 2x.'},
{q:'Quanto fa (x − 1) · (x + 2)?',choices:['x² + x − 2','x² + 3x − 2','x² − x + 2'],answer:0,help:'Scrivi x² + 2x − x − 2.',why:'Esatto: 2x − x = x.'},
{q:'Quanti prodotti calcoli moltiplicando due parentesi con due termini ciascuna?',choices:['4','2','3'],answer:0,help:'Ogni termine della prima parentesi si moltiplica per entrambi i termini della seconda.',why:'Esatto: due prodotti per ciascuno dei due termini, quindi quattro.'}
]});
let completed=[];try{let saved=JSON.parse(localStorage.getItem('polinomi-progress-v1')||'[]');if(Array.isArray(saved))completed=saved.filter(n=>Number.isInteger(n)&&n>=0&&n<lessons.length)}catch(e){}let current=0,step=-1,answered=false;const content=document.getElementById('content'),menu=document.getElementById('menu');function save(){try{localStorage.setItem('polinomi-progress-v1',JSON.stringify(completed))}catch(e){}}function render(){let lesson=lessons[current];menu.innerHTML=lessons.map((l,i)=>`<button type="button" data-lesson="${i}" class="${i===current?'active':''}" ${i===current?'aria-current="step"':''}><span class="number">${completed.includes(i)?'✓':i+1}</span><span>${l.title}</span></button>`).join('');document.getElementById('progressText').textContent=`${completed.length} di ${lessons.length} lezioni completate`;document.getElementById('fill').style.width=(completed.length/lessons.length*100)+'%';document.getElementById('progressBar').setAttribute('aria-valuenow',completed.length);
if(step===-1){content.innerHTML=`<span class="tag">Lezione ${current+1} di ${lessons.length}</span><h2>${lesson.title}</h2><p class="muted">${lesson.intro}</p><p>${lesson.text}</p><div class="example"><div class="math">${lesson.example}</div><p>${lesson.explain}</p></div><div class="tip"><strong>Ricorda</strong><br>${lesson.tip}</div><div class="actions"><button class="primary" data-action="start">Prova gli esercizi →</button></div>`}else if(step<lesson.questions.length){let q=lesson.questions[step];content.innerHTML=`<div class="counter">ESERCIZIO ${step+1} DI ${lesson.questions.length}</div><h2>${lesson.title}</h2><p>${q.q}</p><div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c}</button>`).join('')}</div><div id="feedback" role="status"></div><div class="actions"><button class="secondary" data-action="hint">Mostra un aiuto</button><button class="secondary" data-action="lesson">Rileggi la spiegazione</button></div>`}else{content.innerHTML=`<span class="tag">Lezione completata ✓</span><h2>Ben fatto!</h2><p>Hai completato gli esercizi di <strong>${lesson.title}</strong>.</p><p>Puoi ripassare questa lezione oppure continuare quando vuoi.</p><div class="actions">${current<lessons.length-1?'<button class="primary" data-action="nextlesson">Vai alla prossima lezione →</button>':'<button class="primary" data-action="first">Rivedi il percorso</button>'}<button class="secondary" data-action="lesson">Ripassa la lezione</button></div>`}}
menu.addEventListener('click',e=>{let b=e.target.closest('[data-lesson]');if(!b)return;current=Number(b.dataset.lesson);step=-1;answered=false;render()});content.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.choice!==undefined&&!answered){let q=lessons[current].questions[step],feedback=document.getElementById('feedback');if(Number(b.dataset.choice)===q.answer){answered=true;feedback.className='feedback good';feedback.innerHTML=`<strong>Giusto!</strong> ${q.why}<div class="actions"><button class="primary" data-action="next">${step===lessons[current].questions.length-1?'Completa la lezione':'Continua'} →</button></div>`}else{feedback.className='feedback retry';feedback.textContent='Non è ancora la risposta giusta. '+q.help+' Puoi riprovare.'}return}switch(b.dataset.action){case 'start':step=0;answered=false;render();break;case 'hint':{let f=document.getElementById('feedback');f.className='feedback retry';f.textContent=lessons[current].questions[step].help;break}case 'lesson':step=-1;answered=false;render();break;case 'next':step++;answered=false;if(step===lessons[current].questions.length&&!completed.includes(current)){completed.push(current);save()}render();break;case 'nextlesson':current++;step=-1;render();break;case 'first':current=0;step=-1;render();break}});render();
</script></body></html>
